name: Build

# Builds KikosMayhem.dll against the real SCP:SL server DLLs (downloaded with SteamCMD).
# Push a tag like v1.0.1 to publish a GitHub Release with the DLL attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache SCP:SL server
        id: cache-server
        uses: actions/cache@v4
        with:
          path: ~/scpsl/SCPSL_Data/Managed
          key: scpsl-managed-${{ github.run_id }}
          restore-keys: scpsl-managed-

      - name: Download SCP:SL Dedicated Server (app 996560)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p ~/steamcmd ~/scpsl
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz -C ~/steamcmd
          for i in 1 2 3; do
            ~/steamcmd/steamcmd.sh +force_install_dir ~/scpsl +login anonymous +app_update 996560 validate +quit || true
            [ -f ~/scpsl/SCPSL_Data/Managed/Assembly-CSharp.dll ] && break
          done
          test -f ~/scpsl/SCPSL_Data/Managed/Assembly-CSharp.dll

      - name: Build plugin
        run: dotnet build src/KikosMayhem/KikosMayhem.csproj -c Release -p:SL_REFERENCES=$HOME/scpsl/SCPSL_Data/Managed

      - uses: actions/upload-artifact@v4
        with:
          name: KikosMayhem
          path: src/KikosMayhem/bin/Release/net48/KikosMayhem.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/KikosMayhem/bin/Release/net48/KikosMayhem.dll
          generate_release_notes: true
