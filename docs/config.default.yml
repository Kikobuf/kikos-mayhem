  scp049_speed_per_zombie: 3
  # SCP-966: black figure that appears behind players and poses, sometimes causing a facility-wide blackout.
  scp966_enabled: true
  scp966_min_interval: 45
  scp966_max_interval: 110
  scp966_linger_seconds: 6
  scp966_blackout_chance: 15
  scp966_blackout_seconds: 12
scp079:
# Seconds SCP-079 has to choose a Puppet before one is picked automatically.
  pick_seconds: 90
  # Grace period after Puppet is picked: Puppet locked in the armory, generators locked, no damage.
  grace_seconds: 90
  # Puppet max HP (doesn't scale with tier).
  puppet_base_health: 500
  # SCP-079 and the Puppet hear each other anywhere (079 talks on its SCP chat key; the Puppet talks normally).
  puppet_voice_chat: true
  # Show the Puppet to SCP-079's map as an SCP-049 arrow (uses a hidden dummy player that only SCP-079 can see).
  puppet_map_marker: true
  # Puppet can heal itself with medical items up to this percent of its max HP. SCP-079 pings can heal it further.
  puppet_self_heal_percent: 50
  # HP restored per 1 aux power when SCP-079 pings the Puppet.
  ping_heal_per_aux: 0.5
  # When the Puppet loses a life it respawns in 079's room; both it and SCP-079 are stunned this long.
  respawn_stun_seconds: 5
  # Range of the Puppet's Quick Recycle keybind (server-specific settings).
  quick_recycle_range: 2.5
  # Generators on the map (each un-engaged one is a Puppet life) by player count: under 14 = 2, 14+ = 3, 20+ = 4, 26+ = 5. Extra generators spawn at unused HCZ generator spots.
  generator_thresholds:
  - 8
  - 14
  - 20
  - 26
  # Seconds generators stay blocked (and activating ones are shut off) after the Puppet loses a life.
  generator_lock_after_death: 20
  aux_regen_per_tier:
  - 2.5
  - 4
  - 6
  - 8.5
  - 11
  puppet_kill_xp: 25
  scp_kill_xp: 35
  indirect_kill_xp: 8
  bulkhead_cost: 50
  grenade_ping_cost: 75
  grenade_ping_cooldown: 20
  grenade_ping_count: 5
  overcharge_cost: 100
  overcharge_cooldown: 30
  overcharge_base_radius: 6
  overcharge_radius_per_tier: 1.5
  # Tooth and Nail (Puppet's SCP-127) penetration per tier and hume shield per tier.
  tooth_and_nail_penetration:
  - 50
  - 60
  - 70
  tooth_and_nail_hume_shield:
  - 50
  - 100
  - 150
  hume_regen_per_second: 10
  hume_regen_delay: 12
ascension:
  enabled: true
  # Minimum players in the server for the ascension questline to be possible.
  min_players: 12
  # Seconds of spawn protection both Puppets get on ascension.
  spawn_protection_seconds: 10
  # PCs to find (1 always LCZ, 1 HCZ-or-Entrance, 1 always Entrance).
  pc_count: 3
  # Number of digits in the phone's NATO code.
  code_length: 9
  # How far (meters) the phone call's voice can be heard.
  phone_voice_range: 12
  # Seconds the Puppet has to reach SCP-079's room during the recontainment run (0 = unlimited).
  recontainment_time_limit: 45
  # Use the keypad printed on the Nuke Room's warhead panel. keypad_u / keypad_v: its center in meters from the middle of the panel's face (u = right, v = up the slope, as seen standing at the panel). keypad_pitch_u / keypad_pitch_v: spacing between keys. Admin command 'mayhem keypad' shows the keys so you can nudge these.
  use_map_keypad: true
  keypad_u: -1.024
  keypad_v: -0.382
  keypad_pitch_u: 0.093
  keypad_pitch_v: 0.078
  # Fallback keypad (only if the warhead panel can't be found): placement next to the panel (meters to the side / up).
  keypad_side_offset: 1.39999998
  keypad_height_offset: 0
  ascended_health: 1500
  ascended_regen_delay: 4
  ascended_regen_per_second: 60
  ascended_kill_aura_radius: 15
  ascended_speed_cap: 200
  ascended_crit_multiplier_cap: 21
  # Red Right Hand loadout.
  red_right_hand_items:
  - GunFRMG0
  - GunE11SR
  - KeycardO5
  - Medkit
  - Medkit
  - Adrenaline
  - ArmorHeavy
  - Radio
events:
# Weights for the global event picked each round.
  global_event_weights:
    RareItemsCommon: 12
    FiveXLoot: 12
    ItemChancesInversed: 10
    CustomItemsOnDeath: 10
    CausalityCorruption: 4
    AllItems1853: 8
    FiveXCustomLoot: 10
  # Chance (percent) a sub event also happens this round.
  sub_event_chance: 35
  sub_event_weights:
    BeQuiet: 1
    FinallyAwake: 1
    CandyOnDeath: 1
  # You May Want To Be Quiet: voice loudness (0-1) that makes you explode.
  be_quiet_threshold: 0.850000024
  # Ultimate Loot Pile special event chance (percent) per round and when it happens.
  ultimate_loot_pile_chance: 30
  ultimate_loot_pile_min_time: 300
  ultimate_loot_pile_max_time: 900
  ultimate_loot_pile_items: 25
  # Minutes into the round when Mayhem Protocol / Mayhem Insurgency auto-starts (slightly randomized).
  mayhem_auto_start_minutes: 25
  mayhem_protocol_chance: 35
  mayhem_protocol_seconds: 120
  # [REDACTED] Protocol: arm the nuke during this hour (server local time, 0 = midnight).
  redacted_protocol_enabled: true
  redacted_protocol_hour: 0
  redacted_protocol_delay: 120
  redacted_protocol_scp_count: 3
  # Replace the auto-nuke with the Dead Man's Switch (12/16/2024 change).
  dead_mans_switch: true
audio:
# Volume for sound effects and music (0-1).
  volume: 0.800000012
  music_volume: 0.600000024
