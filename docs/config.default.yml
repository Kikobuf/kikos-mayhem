scps:
# Extra SCP max HP per player in the server.
  health_per_player: 200
  # Show each SCP a pop-up of its Mayhem powers when it spawns.
  show_powers_popup: true
  powers_popup_seconds: 5
  scp173_blink_faster: 50
  scp173_blink_per_dead: 5
  scp173_tantrum_explosion_radius: 2
  scp173_tantrum_health: 150
  scp096_docile_speed: 20
  scp096_distressed_speed: 5
  scp096_enraged_speed: 10
  scp096_post_nuke_max_speed: 110
  scp096_aura_range: 4
