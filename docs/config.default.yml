# Master switch. When false the server plays vanilla SCP:SL.
enabled: true
# Prints extra debug logs to the server console.
debug: false
items:
# Custom item ids that are disabled (never spawn, can't be given). See docs/ITEMS.md for ids.
  disabled: []
  # Show the held custom item's name and description at the bottom of the screen.
  show_held_description: true
  # Aura light intensity / range on dropped custom items.
  aura_intensity: 1.20000005
  aura_range: 1.60000002
  # Custom items thrown into a pit go to SCP-106's dimension and are later recycled into the facility (also O5 / Facility Manager cards).
  recycle_from_pits: true
  # Recycled items come back from the Pocket Dimension to a random facility spot after this many seconds (random between min and max).
  recycle_min_seconds: 90
  recycle_max_seconds: 240
  skinwalker_reveal_seconds: 3
  radiance_heal_per_second: 2
  radiance_max_ahp: 14
  radiance_range: 8
  radiance_revive_cooldown: 120
  warp_coin_cooldown: 30
  lock_to_the_city_lock_seconds: 10
  lock_to_the_city_cooldown: 20
  mayhem_coin_cooldown: 300
  vampirism_start_seconds: 35
  vampirism_seconds_per_kill: 10
  # Hell's Reckoning: seconds to kill an SCP before the jailbird breaks and kills you.
  hells_reckoning_seconds: 120
  pocket_nuke_irradiated_percent: 10
  pocket_nuke_radius: 45
  suicide_vest_damage: 1000
  pink_extract_damage: 1000
  crimson_echo_true_damage: 200
  crimson_echo_puppet_true_damage: 150
  crimson_echo_self_damage: 40
  pinpointer_damage: 200
  peacemaker_scp_heal: 200
  peacemaker_self_cost_percent: 40
  # Mitosis: how far the copy can be from its host before it destabilizes.
  mitosis_max_range: 25
  # Jester's Hat: seconds before the decoy vanishes.
  jesters_hat_decoy_seconds: 30
spawning:
# Average custom items spawned per facility zone room at round start (rarity decides which).
  custom_items_per_room: 0.349999994
  # Relative spawn weight per rarity (Admin items never spawn naturally).
  rarity_weights:
    Common: 50
    Rare: 28
    Epic: 14
    Legendary: 6
    Upgraded: 1.5
    Ascended: 0.5
  # Gate A surface pile: number of custom items + normal items.
  gate_a_custom_items: 6
  gate_a_normal_items: 10
  # Exit (Gate B escape) pile.
  exit_custom_items: 2
  # SCP-079's room pile. Guaranteed 2 (+ extra roll). Only spawns if 079 isn't in the round, or once 079 is contained.
  scp079_room_custom_items: 2
  scp079_room_extra_chance: 35
  # Chance (percent) to get a custom item when escaping for the first time.
  escape_custom_item_chance: 30
  # Rooms where no items spawn.
  blacklisted_rooms:
  - HczWaysideIncinerator
  - Hcz096
  - Pocket
  - HczAcroamaticAbatement
  # Spawn bonus chances (percent) rolled for every human spawn.
  spawn_bonuses:
    ExtraAmmo: 80
    Adrenaline: 20
    Scp207: 25
    Scp500: 5
    A7: 3
    E11: 3
    Jailbird: 2
    MicroHid: 1
    Com45: 0.5
    Scp018: 0.25
    OverloadedCom45: 0.0500000007
  # Halloween: chance (percent) to spawn with a random candy. 'halloween_mode': Auto (October or the game's Halloween event), On, Off.
  halloween_candy_chance: 30
  halloween_mode: Auto
  # Remove dropped items and ragdolls older than this many seconds (0 = never).
  cleanup_after_seconds: 600
effects:
  herd_range: 8
  herd_heal_per_friend: 1
  irradiated_scp_scalar: 0.349999994
  tazed_seconds: 3
  # Nuke room radiation: seconds you can stay before getting Irradiated, then it keeps stacking.
  nuke_room_grace_seconds: 20
  # Humans: radiation grows exponentially the longer you stay (multiplier per second inside past the grace).
  nuke_room_human_growth: 1.12
  # Seconds the Reviving Players effect (SCP-500 revives) waits for a safe spot before fizzling.
  reviving_players_seconds: 30
  nuke_room_human_percent: 1
  nuke_room_scp_percent: 0.100000001
  # SCP-1853: crit chance (percent) and crit damage bonus per dose.
  scp1853_crit_chance: 5
  scp1853_crit_damage: 0.100000001
  scp1853_puppet_crit_chance: 2.5
  scp1853_puppet_crit_damage: 0.0299999993
