  sub_event_chance: 35
  sub_event_weights:
    BeQuiet: 1
    FinallyAwake: 1
    CandyOnDeath: 1
  # You May Want To Be Quiet: voice loudness (0-1) that makes you explode.
  be_quiet_threshold: 0.850000024
  # Ultimate Loot Pile special event chance (percent) per round and when it happens.
  ultimate_loot_pile_chance: 30
  ultimate_loot_pile_min_time: 300
  ultimate_loot_pile_max_time: 900
  ultimate_loot_pile_items: 25
  # Minutes into the round when Mayhem Protocol / Mayhem Insurgency auto-starts (slightly randomized).
  mayhem_auto_start_minutes: 25
  mayhem_protocol_chance: 35
  mayhem_protocol_seconds: 120
  # [REDACTED] Protocol: arm the nuke during this hour (server local time, 0 = midnight).
  redacted_protocol_enabled: true
  redacted_protocol_hour: 0
  redacted_protocol_delay: 120
  redacted_protocol_scp_count: 3
  # Replace the auto-nuke with the Dead Man's Switch (12/16/2024 change).
